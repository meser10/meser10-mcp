# Publishes @meser10/mcp-server to npm with Trusted Publishing (OIDC).
#
# No token anywhere: not in the repository, not in Actions secrets, not on
# anyone's laptop. npm verifies that the request came from this repository and
# this workflow file, so the 90-day granular-token rotation stops applying to
# this package.
#
# The matching configuration lives on npmjs.com, under the package's settings,
# Trusted Publisher: organisation meser10, repository meser10-mcp, workflow
# file publish.yml. If this file is ever renamed, that field has to change too
# or publishing stops working.
#
# To release: bump the version in package.json, commit, tag it
#   git tag v1.0.3 && git push --tags
# then run this workflow from the Actions tab. The tag has to match the version
# in package.json, and the job below refuses to publish if it does not. Until
# the Trusted Publisher above exists, publishing from a laptop with a granular
# token is still the working route.

name: Publish to npm

# Manual only, on purpose.
#
# This job authenticates to npm with OIDC alone, which works only once a
# Trusted Publisher has been configured on npmjs.com for this package
# (Settings, Trusted Publisher, GitHub Actions). Until that exists npm answers
# the publish with a 404, so a tag push would fail every time and mail a
# failure notice on every release. It is wired to workflow_dispatch so the tag
# stays a tag, and publishing is a deliberate click.
#
# Once the Trusted Publisher is configured, restore the tag trigger by putting
# these two lines back above workflow_dispatch:
#   push:
#     tags: ['v*']
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # The whole point. Without this, GitHub will not mint the OIDC token and
      # npm has no way to recognise this workflow.
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Trusted publishing needs Node 22.14.0 or newer.
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Use an npm that supports trusted publishing
        # Node 22 ships npm 10, and trusted publishing needs 11.5.1 or newer.
        run: |
          npm install -g npm@latest
          npm --version

      - name: Install
        run: npm ci

      - name: Test
        # 43 unit tests and 12 end-to-end tests over real MCP stdio. The e2e
        # suite runs a local stand-in for the platform, so it needs no
        # credentials and sends nothing.
        run: npm test

      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $PKG." >&2
            exit 1
          fi
          echo "Publishing version $PKG."

      - name: Publish
        # No NODE_AUTH_TOKEN and no --provenance flag. OIDC handles the
        # authentication, and npm generates the provenance attestation on its
        # own when a package is published this way.
        run: npm publish
